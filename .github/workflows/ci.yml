name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run Ruff
        run: ruff check .
      - name: Run Ruff format check
        run: ruff format --check .
      - name: Run MyPy
        run: mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Install Go tools for integration tests
        run: |
          GO_VERSION=1.22.0
          wget -q https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
      - name: Install system dependencies for Go tools
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install test tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.14.0
          go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@v2.3.0
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.7
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=core --cov=reporting --cov=utils --cov-fail-under=40

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.extract_tag.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=sha-{{sha}},enable=true
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          platforms: linux/amd64,linux/arm64
      - name: Extract sha tag for security scan
        id: extract_tag
        run: |
          # Find the sha-* tag from meta output
          sha_tag=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | grep '^sha-' | head -1)
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${sha_tag}" >> $GITHUB_OUTPUT

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.docker.outputs.image_ref }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif