# Pre-commit hooks for vapt-recon
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, typer, rich, jinja2, pyyaml]
        args: [--strict, --ignore-missing-imports]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: debug-logger
      - id: detect-private-key

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, core, reporting, utils, -ll, -f, json]
        exclude: tests/

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: pytest tests/ -x -q --tb=short -k "not integration"
        language: system
        pass_filenames: false
        stages: [commit]

      - id: Dodge-final-validation
        name: Final validation
        entry: bash -c "python -c 'import core.models, core.recon, reporting'"
        language: system
        pass_filenames: false
        stages: [commit]