[project]
name = "vapt-recon"
version = "0.1.0"
description = "Automated VAPT reconnaissance pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "rich>=13.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "weasyprint>=61",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "asyncio-throttle>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "W", "PTH", "RUF", "TC", "TRY", "PD", "PER", "PIE", "TID", "TCH", "ARG", "SIM", "NPY", "ICN", "FLY", "PL", "TRY", "A", "Q", "N", "T", "S", "V"]
lint.ignore = ["S101", "TRY003", "TCH003", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["vapt_recon*"]